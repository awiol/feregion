name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Install test environment
        run: uv sync --group test
      - name: Fetch hash-verified FE source tables
        run: uv run python -m tools.fetch_obspy_fe_data
      - name: Run tests with branch coverage
        run: >-
          uv run pytest -q
          --ignore=tests/test_obspy_oracle.py
          --cov=feregion --cov-branch --cov-report=term-missing

  reference-oracle:
    name: Independent ObsPy oracle
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Install test and oracle dependencies
        run: uv sync --group test --group benchmark
      - name: Fetch hash-verified FE source tables
        run: uv run python -m tools.fetch_obspy_fe_data
      - name: Run source and installed-ObsPy reference tests
        run: >-
          uv run pytest -q
          tests/test_source_reproduction.py tests/test_obspy_oracle.py

  minimum-dependencies:
    name: Minimum declared dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Create lower-bound environment
        run: uv venv --python 3.11 .venv-minimum
      - name: Install declared lower bounds
        run: >-
          uv pip install --python .venv-minimum/bin/python
          "numpy==1.26.0" "pandas==2.1.0" "shapely==2.0.0"
          "pytest==8.0.0" "pytest-cov==5.0.0" -e .
      - name: Run compatibility suite at lower bounds
        run: >-
          .venv-minimum/bin/python -m pytest -q
          --ignore=tests/test_source_reproduction.py
          --ignore=tests/test_obspy_oracle.py

  quality:
    name: Static quality and packaging
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Install development environment
        run: uv sync --group test --group lint
      - name: Check Ruff formatting
        run: uv run ruff format --check .
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run mypy
        run: uv run mypy src/feregion tools benchmarks
      - name: Build distributions
        run: uv build
      - name: Verify wheel in an isolated environment
        run: >-
          uv run python -m tools.verify_wheel
          "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          --python 3.11
