name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Install test environment
        run: uv sync --group test
      - name: Fetch hash-verified FE source tables
        run: uv run python -m tools.fetch_obspy_fe_data
      - name: Run tests with branch coverage
        run: >-
          uv run pytest -q
          --cov=feregion --cov-branch --cov-report=term-missing

  quality:
    name: Static quality and packaging
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Install development environment
        run: uv sync --group test --group lint
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run mypy
        run: uv run mypy src/feregion tools benchmarks
      - name: Build distributions
        run: uv build
      - name: Verify wheel in an isolated environment
        run: uv run python -m tools.verify_wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" --python 3.11
