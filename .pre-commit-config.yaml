repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: Ruff check
        entry: uv run --no-sync ruff check
        language: system
        types_or: [python, pyi]
      - id: pytest
        name: pytest
        entry: uv run --no-sync pytest -q
        language: system
        pass_filenames: false
        always_run: true
